name: Todo Backend CI

on:
  push:
    branches:
      - 'TP-*'
      - develop
      - main

  pull_request:
    branches:
      - 'TP-*'
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Quality Checks
  # ==========================================

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: ecl-todo

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U admin -d ecl-todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Node.js
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ------------------------------------------
      # Dependencies
      # ------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------
      # Test Environment
      # ------------------------------------------

      - name: Configure test environment
        run: cp .env.example .env

      # ------------------------------------------
      # Prisma
      # ------------------------------------------

      - name: Generate Prisma client
        run: npm run db:generate

      # ------------------------------------------
      # Code Quality
      # ------------------------------------------

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # ------------------------------------------
      # Tests
      # ------------------------------------------

      - name: Run tests
        run: npm test

      # ------------------------------------------
      # Application Build
      # ------------------------------------------

      - name: Build
        run: npm run build

  # ==========================================
  # Docker Build & Push
  # ==========================================

  docker:
    name: Build and Push Docker Image
    needs: quality
    runs-on: ubuntu-latest

    # Docker image is created ONLY after a push to main.
    # PRs and other branches only run quality checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Login to GHCR
      # ------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Docker Image Metadata
      # ------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/todo-backend
          tags: |
            type=raw,value=latest

      # ------------------------------------------
      # Build & Push Docker Image
      # ------------------------------------------

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
