name: Todo Backend CI

on:
  push:
    branches:
      - TP-*
      - develop
      - main

  pull_request:
    branches:
      - TP-*
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: ecl-todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ecl-todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          PORT=3001

          POSTGRES_USER=admin
          POSTGRES_PASSWORD=admin123
          POSTGRES_DB=ecl-todo
          POSTGRES_PORT=5432

          DATABASE_URL=postgresql://admin:admin123@localhost:5432/ecl-todo?schema=public

          GATEWAY_URL_DEV=http://localhost:5713
          GATEWAY_URL_UAT=http://todo-gateway-uat.excodelabs.com
          GATEWAY_URL_PROD=https://todo-gateway.excodelabs.com
          EOF

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
